name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PACKAGE_NAME: icomatic

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Icomatic/Icomatic.csproj

      - name: Build Program
        run: dotnet build Icomatic/Icomatic.csproj --no-restore -c Release

      - name: Set Tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          "VERSION=$($env:RELEASE_TAG.Substring(1))" >> "$env:GITHUB_ENV"

      - name: Publish Program for Windows
        run: dotnet publish Icomatic/Icomatic.csproj --no-restore -r win-x64 -c Release --property Version="$env:VERSION" --output "./publish/${env:PACKAGE_NAME}_win_x64"

      - name: Publish Program for Linux
        run: dotnet publish Icomatic/Icomatic.csproj --no-restore -r linux-x64 -c Release --property Version="$env:VERSION" --output "./publish/${env:PACKAGE_NAME}_linux_x64"

      - name: Zip
        run: |
          New-Item -ItemType Directory -Force ./dist | Out-Null
          foreach ($platform in 'win_x64', 'linux_x64') {
            $package = "${env:PACKAGE_NAME}_$platform"
            $directory = "./publish/$package"
            Copy-Item -LiteralPath LICENSE.txt, licenses.txt -Destination $directory
            Compress-Archive -LiteralPath $directory -DestinationPath "./dist/$package.zip"
          }
          Get-ChildItem ./dist

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./dist/${{ env.PACKAGE_NAME }}_win_x64.zip
            ./dist/${{ env.PACKAGE_NAME }}_linux_x64.zip
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
